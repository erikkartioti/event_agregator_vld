<!DOCTYPE html>
<html lang="en">
<head>
  <title>Styled OpenLayers Map with Popups</title>
  <script src="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@latest/dist/ol.css">
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .ol-popup {
      position: absolute;
      background-color: white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.2);
      padding: 15px;
      border-radius: 10px;
      border: 1px solid #cccccc;
      bottom: 12px;
      left: -50px;
      min-width: 280px;
      font-size: 12px;
    }
    .ol-popup:after, .ol-popup:before {
      top: 100%;
      border: solid transparent;
      content: " ";
      height: 0;
      width: 0;
      position: absolute;
      pointer-events: none;
    }
    .ol-popup:after {
      border-top-color: white;
      border-width: 10px;
      left: 48px;
      margin-left: -10px;
    }
    .ol-popup:before {
      border-top-color: #cccccc;
      border-width: 11px;
      left: 48px;
      margin-left: -11px;
    }
    .ol-popup-closer {
      text-decoration: none;
      position: absolute;
      top: 2px;
      right: 8px;
      font-size: 1.5em;
      color: #333;
    }
    .ol-popup-closer:after {
      content: "✖";
    }

    .popup-event-card {
      border: 1px solid #eee;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      background-color: #f9f9f9;
    }
    .popup-event-card h5 {
      margin-top: 0;
      margin-bottom: 5px;
      font-size: 1.1em;
      color: #333;
    }
    .popup-event-card p {
      margin: 3px 0;
      font-size: 0.9em;
      color: #555;
    }
    .popup-event-card p strong {
      color: #444;
    }
    .popup-address {
        font-weight: bold;
        margin-bottom: 10px;
        font-size: 1.2em;
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="popup" class="ol-popup">
    <a href="#" id="popup-closer" class="ol-popup-closer"></a>
    <div id="popup-content"></div>
  </div>

  <script>
    // Styling function (remains the same as your original)
    function googleLikeStyle(feature, resolution) {
      const geometryType = feature.getGeometry().getType();
      const properties = feature.getProperties();
      const styles = [];

      if ((properties['$type'] === 'LineString' || properties['$type'] === 'MultiLineString') && properties['building'] === 'yes') {
        return {
          visibility: 'none'
        };
      }

      if (properties['$type'] === 'MultiLineString') {
        return [];
      }

      if (properties['landuse'] === 'military'
      || properties['landuse'] === 'allotments'
      || properties['landuse'] === 'residential'
      || properties['landuse'] === 'construction'
      || properties['landuse'] === 'landfill'
      || properties['landuse'] === 'industrial'
      || properties['landuse'] === 'commercial'
      || properties['landuse'] === 'retail'
      || properties['landuse'] === 'garages'
      || properties['landuse'] === 'railway'
      || properties['landuse'] === 'quarry'
      || properties['landuse'] === 'greenhouse_horticulture'
      || properties['landuse'] === 'recreation_ground'
      || properties['landuse'] === 'brownfield') {
          return [];
      }

      if (properties['highway'] === 'footway'
      || properties['highway'] === 'steps'
      || properties['barrier']
      || properties['railway']
      || properties['waterway'] === 'river'
      || properties['other_tags'] === 'boundary'
      || properties['waterway'] === 'canal'
      || properties['wires']) {
          return [];
      }

      if (properties['amenity']==='parking'
      || properties['amenity'] === 'school'
      || properties['amenity'] === 'college'
      || properties['amenity'] === 'post_office'
      || properties['amenity'] === 'hospital'
      || properties['amenity'] === 'marketplace'
      || properties['amenity'] === 'restaurant'
      || properties['amenity'] === 'kindergarten'
      || properties['amenity'] === 'university'
      || properties['amenity'] === 'police') {
          return [];
      }

      if (properties['place'] === 'city'
      || properties['place'] === 'town'
      || properties['place'] === 'suburb'
      || properties['place'] === 'village'
      || properties['place'] === 'locality'
      || properties['place'] === 'neighbourhood'
      || properties['place'] === 'square') {
          return [];
      }

      if (properties['boundary']==='administrative'
      || properties['boundary']==='protected_area') {
          return [];
      }

      if (properties['leisure']==='stadium'
      || properties['leisure']==='sports_centre'
      || properties['natural']==='fell'
      || properties['shop']==='greengrocer'){
          return [];
      }

      const zoom = map.getView().getZoom();

      const colors = {
          road: 'rgba(200, 200, 200, 0.8)',
          building: 'rgba(180, 180, 180, 1)',
          buildingAlpha: 'rgba(0, 0, 0, 0)',
          park: 'rgba(170, 240, 170, 0.6)',
          forest: 'rgba(0, 128, 0, 0.4)',
          cemetery: 'rgba(0, 110, 0, 0.5)',
          water: 'rgba(170, 205, 255, 1)',
      };

      const showTextAtZoomLevel = 15;
      const showBuildingsAtZoomLevel = 16;

      if (geometryType === 'Polygon' || geometryType === 'MultiPolygon') {
          if (properties['landuse'] === 'park'
          || properties['landuse'] === 'greenfield'
          || properties['landuse'] === 'meadow'
          || properties['landuse'] === 'farmland'
          || properties['landuse'] === 'grass'
          || properties['landuse'] === 'orchard'
          || properties['landuse'] === 'forest'
          || properties['leisure'] === 'park'
          || properties['leisure'] === 'garden'
          || properties['leisure'] === 'pitch'
          || properties['natural'] === 'scree'
          || properties['natural'] === 'grassland'
          || properties['natural'] === 'scrub'
          || properties['natural'] === 'heath') {
              styles.push(new ol.style.Style({
                  fill: new ol.style.Fill({ color: colors.park }),
                  stroke: null
              }));
          } else if (properties['natural'] === 'wood') {
              styles.push(new ol.style.Style({
                  fill: new ol.style.Fill({ color: colors.forest }),
                  stroke: null
              }));
          } else if (properties['landuse'] === 'cemetery') {
              styles.push(new ol.style.Style({
                  fill: new ol.style.Fill({ color: colors.cemetery }),
                  stroke: null
              }));
          } else if (properties['building'] && zoom >= showBuildingsAtZoomLevel) {
              styles.push(new ol.style.Style({
                  fill: new ol.style.Fill({ color: colors.building }),
                  stroke: null
              }));
          } else if (properties['building'] && zoom < showBuildingsAtZoomLevel && zoom > 5) {
              styles.push(new ol.style.Style({
                  fill: new ol.style.Fill({ color: colors.buildingAlpha }),
                  stroke: null
              }));
          } else if (properties['natural'] === 'water') {
              styles.push(new ol.style.Style({
                  fill: new ol.style.Fill({ color: colors.water }),
                  stroke: null
              }));
          } else {
              if (zoom < showBuildingsAtZoomLevel) {
                  styles.push(new ol.style.Style({
                      fill: new ol.style.Fill({ color: colors.road }),
                      stroke: null
                  }));
              } else {
                  styles.push(new ol.style.Style({
                      fill: new ol.style.Fill({ color: colors.road }),
                      stroke: null
                  }));
              }
          }
      } else if (geometryType === 'LineString') {
          if (zoom >= showTextAtZoomLevel) {
              styles.push(new ol.style.Style({
                  stroke: new ol.style.Stroke({
                      color: colors.road,
                      width: 2
                  }),
                  text: new ol.style.Text({
                      text: properties.name || '',
                      font: '12px Calibri,sans-serif',
                      fill: new ol.style.Fill({ color: '#333' }),
                      stroke: new ol.style.Stroke({ color: '#fff', width: 2 }),
                      placement: 'line',
                  })
              }));
          } else {
              styles.push(new ol.style.Style({
                  stroke: new ol.style.Stroke({
                      color: colors.road,
                      width: 2
                  })
              }));
          }
      }
      return styles;
    }

    // Initialize the map
    var map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.VectorTile({
          source: new ol.source.VectorTile({
            format: new ol.format.MVT(),
            url: 'http://localhost:9090/data/tiles/{z}/{x}/{y}.pbf' // Ensure this tile server is running
          }),
          style: googleLikeStyle
        })
      ],
      view: new ol.View({
        center: ol.proj.fromLonLat([44.678, 43.032]), // Centered roughly between the points
        zoom: 15 // Adjusted zoom to see markers better
      })
    });

    // --- Popup Implementation ---

    // 1. Event Data (Simulated - you'll fetch this from your DB in a real app)
    // Coordinates: [Longitude, Latitude]
    const eventLocations = [
      {
        id: 'rus_theatre',
        address: "Пл Ленина, 3 (Русский театр)",
        coordinates: [44.679417, 43.030317],
        events: [
          { title: "Ревизор", location: "Русский театр", genre: "Комедия", date: "2025-07-10 19:00", age_restriction: "12+", scene: "Основная сцена", details: "Знаменитая комедия Н.В. Гоголя." },
          { title: "Чайка", location: "Русский театр", genre: "Драма", date: "2025-07-15 19:30", age_restriction: "16+", scene: "Малая сцена", details: "Пьеса А.П. Чехова." }
        ]
      },
      {
        id: 'mariinsky_ballet',
        address: "ул. Тхапсаева, д.18 (Мариинский театр, балеты)",
        coordinates: [44.676444, 43.031055],
        events: [
          { title: "Лебединое озеро", location: "Мариинский театр (филиал)", genre: "Балет", date: "2025-08-01 20:00", age_restriction: "6+", scene: "Сцена оперы и балета", details: "Классический балет П.И. Чайковского." },
          { title: "Щелкунчик", location: "Мариинский театр (филиал)", genre: "Балет", date: "2025-08-05 18:00", age_restriction: "0+", scene: "Сцена оперы и балета", details: "Волшебная сказка для всей семьи." }
        ]
      },
      {
        id: 'mariinsky_music',
        address: "ул. Миллера, д.34 (Мариинский театр, музыкальные выступления)",
        coordinates: [44.677962, 43.036584],
        events: [
          { title: "Вечер симфонической музыки", location: "Концертный зал (филиал Мариинского)", genre: "Классическая музыка", date: "2025-09-12 19:00", age_restriction: "12+", scene: "Концертный зал", details: "Произведения Моцарта и Бетховена." }
        ]
      }
    ];

    // 2. Popup Overlay Elements
    const popupContainer = document.getElementById('popup');
    const popupContent = document.getElementById('popup-content');
    const popupCloser = document.getElementById('popup-closer');

    const overlay = new ol.Overlay({
      element: popupContainer,
      autoPan: { // Use object for autoPan options
        animation: {
          duration: 250,
        },
      },
    });
    map.addOverlay(overlay);

    popupCloser.onclick = function () {
      overlay.setPosition(undefined);
      popupCloser.blur();
      return false;
    };

    // 3. Create Markers and Vector Layer
    const markerFeatures = eventLocations.map(location => {
      const feature = new ol.Feature({
        geometry: new ol.geom.Point(ol.proj.fromLonLat(location.coordinates)),
        locationData: location // Attach all data to the feature
      });
      // You can set a specific style for markers if you don't want the default
      feature.setStyle(new ol.style.Style({
        image: new ol.style.Circle({
          radius: 7,
          fill: new ol.style.Fill({color: 'rgba(255, 0, 0, 0.7)'}), // Red fill
          stroke: new ol.style.Stroke({color: 'white', width: 2})
        })
      }));
      return feature;
    });

    const markerSource = new ol.source.Vector({
      features: markerFeatures
    });

    const markerLayer = new ol.layer.Vector({
      source: markerSource,
      zIndex: 10 // Ensure markers are on top of tiles
    });
    map.addLayer(markerLayer);

    // 4. Map Click Handler for Popups
    map.on('click', function (evt) {
      const feature = map.forEachFeatureAtPixel(evt.pixel,
        function (feature, layer) {
          // Check if the feature is from our markerLayer
          if (layer === markerLayer) {
            return feature;
          }
        });

      if (feature) {
        const locationData = feature.get('locationData');
        const coordinates = feature.getGeometry().getCoordinates();
        let contentHtml = `<div class="popup-address">${locationData.address}</div>`;

        if (locationData.events && locationData.events.length > 0) {
          locationData.events.forEach(event => {
            contentHtml += `
              <div class="popup-event-card">
                <h5>${event.title}</h5>
                <p><strong>Жанр:</strong> ${event.genre || 'N/A'}</p>
                <p><strong>Дата:</strong> ${event.date ? new Date(event.date).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'N/A'}</p>
                <p><strong>Возраст:</strong> ${event.age_restriction || 'N/A'}</p>
                ${event.scene && event.scene !== 'N/A' ? `<p><strong>Сцена:</strong> ${event.scene}</p>` : ''}
                ${event.details ? `<p><small>${event.details}</small></p>` : ''}
              </div>`;
          });
        } else {
          contentHtml += "<p>Нет доступных событий для этого места.</p>";
        }

        popupContent.innerHTML = contentHtml;
        overlay.setPosition(coordinates);
      } else {
        overlay.setPosition(undefined);
        popupCloser.blur();
      }
    });

  </script>
</body>
</html>
