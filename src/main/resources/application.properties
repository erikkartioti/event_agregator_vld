spring.application.name=eventagregatornew
server.port=8090

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/events}
spring.datasource.username=${DB_USER:events_admin}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver



# JPA/Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Optional: To see SQL statements in the console
spring.jpa.show-sql=true

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# Spring-планировщики можно отключить, когда ETL выполняет Airflow (см. docker-compose.yml)
app.schedulers.enabled=${APP_SCHEDULERS_ENABLED:true}
